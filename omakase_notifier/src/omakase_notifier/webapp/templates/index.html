<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Omakase Notifier</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div id="app">

    <header class="navbar">
      <div class="navbar-inner">
        <h1 class="nav-title" id="navTitle">ホーム</h1>
        <button class="nav-btn" id="settingsBtn" aria-label="settings">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="content">

      <!-- HOME / CALENDAR -->
      <section id="view-home" class="view active">
        <div class="card calendar">
          <div class="cal-header">
            <button class="ghost" id="calPrev" aria-label="prev">‹</button>
            <div class="cal-title" id="calTitle">2026年5月</div>
            <button class="ghost" id="calNext" aria-label="next">›</button>
          </div>
          <div class="cal-weekdays">
            <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span><span class="sun">日</span>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>

        <div class="card" id="dayDetail">
          <h2 class="section-title" id="dayTitle">日付を選択</h2>
          <div class="day-empty muted" id="dayEmpty">空席のある日付（●）をタップすると詳細が表示されます。</div>
          <ul class="slot-list" id="slotList"></ul>
        </div>
      </section>

      <!-- RESTAURANTS -->
      <section id="view-restaurants" class="view">
        <div class="search-wrap">
          <input id="restSearch" type="search" placeholder="店舗を検索…" />
          <button id="refreshListBtn" class="primary">リスト更新</button>
        </div>
        <div class="card list" id="restList"></div>
      </section>

      <!-- USERS -->
      <section id="view-users" class="view">
        <div class="users-layout">
          <div class="users-pane">
            <div class="pane-header">
              <h2 class="section-title">ユーザー</h2>
              <button class="primary small" id="addUserBtn">＋ 追加</button>
            </div>
            <div class="card list" id="userList"></div>
          </div>
          <div class="users-detail" id="userDetail">
            <div class="muted" style="padding:24px">ユーザーを選択してください。</div>
          </div>
        </div>
      </section>

    </main>

    <nav class="tabbar">
      <a href="#home" class="tab active" data-view="home">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>ホーム</span>
      </a>
      <a href="#restaurants" class="tab" data-view="restaurants">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v9a3 3 0 0 0 6 0V2"/><line x1="9" y1="11" x2="9" y2="22"/><path d="M15 2v20M19 2c-2 0-3 2-3 5s1 5 3 5"/></svg>
        <span>店舗</span>
      </a>
      <a href="#users" class="tab" data-view="users">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>ユーザー</span>
      </a>
    </nav>

  </div>

  <!-- Bottom-sheet modal root -->
  <div id="modalRoot" class="modal hidden">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <button class="sheet-cancel" id="sheetCancel">キャンセル</button>
        <h3 class="sheet-title" id="sheetTitle"></h3>
        <button class="sheet-save" id="sheetSave">保存</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
