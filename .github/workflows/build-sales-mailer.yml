name: Build Sales Mailer desktop app

on:
  workflow_dispatch:
  push:
    paths:
      - "sales_mail_app/**"
      - ".github/workflows/build-sales-mailer.yml"
  pull_request:
    paths:
      - "sales_mail_app/**"
      - ".github/workflows/build-sales-mailer.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: sales_mail_app

env:
  PYI_ARGS: >-
    --noconfirm --onefile --console --name SalesMailer
    --icon assets/icon.ico --add-data assets:assets
    --collect-submodules anthropic --collect-submodules textual --collect-data textual --collect-submodules rich

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build (PyInstaller)
        shell: bash
        run: pyinstaller $PYI_ARGS run_app.py

      - name: Self-test and desktop icon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\dist\SalesMailer.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }
          .\dist\SalesMailer.exe --install-shortcut
          if ($LASTEXITCODE -ne 0) { throw "install-shortcut failed" }
          $shell = New-Object -ComObject WScript.Shell
          $found = Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter *.lnk |
            Where-Object { $shell.CreateShortcut($_.FullName).TargetPath.EndsWith('SalesMailer.exe') }
          if (-not $found) { throw "SalesMailer shortcut not found on Desktop" }
          Write-Output "shortcut: $($found.FullName) -> $($shell.CreateShortcut($found.FullName).TargetPath)"

      - name: Self-test and desktop icon (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/SalesMailer --self-test
          mkdir -p ~/Desktop
          ./dist/SalesMailer --install-shortcut
          test -x ~/Desktop/営業メール自動化.command
          cat ~/Desktop/営業メール自動化.command
          cd dist && ditto -c -k --keepParent SalesMailer SalesMailer-macOS.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: SalesMailer-Windows
          path: sales_mail_app/dist/SalesMailer.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: SalesMailer-macOS
          path: sales_mail_app/dist/SalesMailer-macOS.zip
