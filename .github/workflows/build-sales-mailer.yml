name: Build Sales Mailer desktop app

on:
  workflow_dispatch:
  push:
    paths:
      - "sales_mail_app/**"
      - ".github/workflows/build-sales-mailer.yml"
  pull_request:
    paths:
      - "sales_mail_app/**"
      - ".github/workflows/build-sales-mailer.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: sales_mail_app

env:
  PYI_ARGS: >-
    --noconfirm --onefile --console --name SalesMailer
    --icon assets/icon.ico --add-data assets:assets
    --collect-submodules anthropic --collect-submodules textual --collect-data textual --collect-submodules rich

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build (PyInstaller)
        shell: bash
        run: pyinstaller $PYI_ARGS run_app.py

      - name: Self-test and desktop icon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\dist\SalesMailer.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }
          .\dist\SalesMailer.exe --install-shortcut
          if ($LASTEXITCODE -ne 0) { throw "install-shortcut failed" }
          $desktop = [Environment]::GetFolderPath('Desktop')
          Write-Output "Desktop: $desktop"
          Get-ChildItem -Force -LiteralPath $desktop | ForEach-Object { Write-Output ("  {0} ({1} bytes)" -f $_.Name, $_.Length) }
          $lnk = Join-Path $desktop '営業メール自動化.lnk'
          if (-not (Test-Path -LiteralPath $lnk)) { throw "shortcut with the Japanese name was not created" }
          # WScript.Shell は日本語のパスを読めないため、英数字名の一時ファイルにコピーしてリンク先を確認する
          $copy = Join-Path $env:RUNNER_TEMP 'check.lnk'
          Copy-Item -LiteralPath $lnk -Destination $copy -Force
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($copy).TargetPath
          Write-Output "shortcut -> $target"
          if ($target -notlike '*SalesMailer.exe') { throw "unexpected shortcut target: $target" }
          # テスト環境のアイコン（--demo 付き）
          .\dist\SalesMailer.exe --demo --install-shortcut
          if ($LASTEXITCODE -ne 0) { throw "install-shortcut (test environment) failed" }
          $demo = Join-Path $desktop '営業メール自動化（テスト環境）.lnk'
          if (-not (Test-Path -LiteralPath $demo)) { throw "test environment shortcut was not created" }
          Copy-Item -LiteralPath $demo -Destination $copy -Force
          $args2 = (New-Object -ComObject WScript.Shell).CreateShortcut($copy).Arguments
          Write-Output "test environment shortcut arguments: $args2"
          if ($args2 -notlike '*--demo*') { throw "unexpected arguments: $args2" }
          # 自動送信（テスト環境なので送信せずに記録だけ）
          .\dist\SalesMailer.exe --demo --auto-send
          if ($LASTEXITCODE -ne 0) { throw "auto-send (test environment) failed" }
          # 毎日の自動送信をタスク スケジューラに登録・確認・解除
          .\dist\SalesMailer.exe --schedule-auto-send 09:30
          if ($LASTEXITCODE -ne 0) { throw "schedule failed" }
          schtasks /Query /TN "SalesMailer AutoSend" /V /FO LIST | Select-String -Pattern "Task To Run|Schedule Type|Start Time|Days"
          if ($LASTEXITCODE -ne 0) { throw "scheduled task not found" }
          .\dist\SalesMailer.exe --unschedule-auto-send
          if ($LASTEXITCODE -ne 0) { throw "unschedule failed" }

      - name: Self-test, desktop icon and installer disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/SalesMailer --self-test
          mkdir -p ~/Desktop
          ./dist/SalesMailer --install-shortcut
          test -x ~/Desktop/営業メール自動化.command
          cat ~/Desktop/営業メール自動化.command
          ./dist/SalesMailer --demo --install-shortcut
          grep -q -- '--demo' ~/Desktop/営業メール自動化（テスト環境）.command
          # ダブルクリックで開き、SalesMailer を「Applications」へドラッグするだけでインストールできるディスクイメージ
          mkdir -p dmg
          cp dist/SalesMailer dmg/
          cp packaging/mac/はじめにお読みください.txt dmg/
          ln -s /Applications dmg/Applications
          for i in 1 2 3; do
            hdiutil create -volname "営業メール自動化" -srcfolder dmg -ov -format UDZO dist/SalesMailer-macOS.dmg && break
            sleep 5
          done
          test -f dist/SalesMailer-macOS.dmg

      - name: Add the Windows guide
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item -LiteralPath 'packaging/windows/はじめにお読みください.txt' -Destination dist/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: SalesMailer-Windows
          path: |
            sales_mail_app/dist/SalesMailer.exe
            sales_mail_app/dist/はじめにお読みください.txt
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: SalesMailer-macOS
          path: sales_mail_app/dist/SalesMailer-macOS.dmg
