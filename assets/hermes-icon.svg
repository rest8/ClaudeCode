<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7900"/>
      <stop offset="100%" stop-color="#C75300"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE4C4"/>
      <stop offset="100%" stop-color="#E6B98A"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="256" height="256" rx="44" ry="44" fill="url(#bg)"/>

  <!-- handle -->
  <path d="M96 86 q32 -42 64 0"
        fill="none" stroke="#3a1f0a" stroke-width="10" stroke-linecap="round"/>

  <!-- bag body (Kelly/Birkin like) -->
  <rect x="64" y="86" width="128" height="100" rx="10" ry="10"
        fill="url(#bag)" stroke="#3a1f0a" stroke-width="5"/>

  <!-- flap -->
  <path d="M64 86 L128 132 L192 86 Z" fill="#D6A26A" stroke="#3a1f0a" stroke-width="5" stroke-linejoin="round"/>

  <!-- clasp -->
  <rect x="118" y="124" width="20" height="20" rx="3" fill="#F4E4B3" stroke="#3a1f0a" stroke-width="3"/>
  <circle cx="128" cy="134" r="3" fill="#3a1f0a"/>

  <!-- "H" monogram -->
  <text x="128" y="220" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">H</text>
</svg>
