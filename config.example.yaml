# Omakase 空席通知アプリ - 共通設定
#
# このファイルを `config.yaml` にコピーして編集してください。
# 配信先と購読店舗は CLI で `subscribers.yaml` に追加します:
#   python -m omakase_notifier add-subscriber --id me --channel email --to me@x.com
#   python -m omakase_notifier subscribe me <restaurant_id> --date 2026-05-15 --party-size 2

# ポーリング間隔（秒）。短すぎるとサイトに負荷をかけるため60秒以上推奨
poll_interval_seconds: 90

# 店舗一覧クロール時の起点 URL（複数指定可）
discover_index_urls:
  - "https://omakase.in/ja/restaurants"

# 認証 Cookie（ログイン必須ページを取得する場合）
# ブラウザで Omakase にログイン後 DevTools > Application > Cookies からコピー
cookies: {}
  # _omakase_session: "xxxxxxxxxxxxxxxx"

user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

# 通知認証情報（チャネル単位の共通設定）。
# 個別の宛先 (to_addr / userId / webhook URL) は subscribers.yaml に書きます。
notifications:
  email:
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    use_tls: true
    username: "you@example.com"
    # Gmail はアプリパスワードを使用
    password: "REPLACE_ME"
    from_addr: "you@example.com"

  line:
    # LINE Messaging API のチャネルアクセストークン (長期)
    # https://developers.line.biz/console/ で発行
    channel_access_token: "REPLACE_ME"

# 永続化ファイル
state_file: "state.json"
restaurants_file: "restaurants.json"
subscribers_file: "subscribers.yaml"

log_file: "omakase_notifier.log"
log_level: "INFO"
tray_enabled: true
